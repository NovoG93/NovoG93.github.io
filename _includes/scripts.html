<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  (async () => {
    try {
      mermaid.initialize({ startOnLoad: false });

      if (document.readyState === 'loading') {
        await new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve, { once: true }));
      }

      const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');

      const nodesToProcess = [];

      for (const block of mermaidBlocks) {
        const content = block.textContent;

        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = content;

        const pre = block.closest('pre');
        const container = pre ? (pre.closest('.highlighter-rouge') || pre) : block.parentNode;

        if (container) {
          container.replaceWith(div);
          nodesToProcess.push(div);
        }
      }

      if (nodesToProcess.length > 0) {
        await mermaid.run({ nodes: nodesToProcess });
      }
    } catch (error) {
      console.error('Mermaid integration error:', error);
    }
  })();
</script>

<!-- Theme Toggle Script -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggle = document.getElementById('theme-toggle');
    if (!toggle) {
      console.warn('Theme toggle button not found');
      return;
    }

    function getTheme() {
      const stored = localStorage.getItem('theme');
      if (stored) return stored;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      updateToggleIcon(theme);
    }

    function updateToggleIcon(theme) {
      const lightIcon = toggle.querySelector('.theme-toggle__icon--light');
      const darkIcon = toggle.querySelector('.theme-toggle__icon--dark');
      if (lightIcon && darkIcon) {
        lightIcon.style.display = theme === 'dark' ? 'inline' : 'none';
        darkIcon.style.display = theme === 'light' ? 'inline' : 'none';
      }
    }

    // Initialize
    updateToggleIcon(getTheme());

    // Toggle on click
    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      const current = document.documentElement.getAttribute('data-theme') || getTheme();
      const next = current === 'dark' ? 'light' : 'dark';
      setTheme(next);
      console.log('Theme switched to:', next);
    });

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      if (!localStorage.getItem('theme')) {
        setTheme(e.matches ? 'dark' : 'light');
      }
    });

    console.log('Theme toggle initialized');
  });
</script>
